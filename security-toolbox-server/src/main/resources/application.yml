server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8080

spring:
  application:
    name: security-toolbox-server
  datasource:
    url: jdbc:h2:file:./data/security-toolbox;MODE=PostgreSQL;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true
        order_updates: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 50
  mvc:
    # Streaming AI responses own their timeout budget. Keep Spring MVC from
    # terminating the connection before the runtime/client limits can report a reason.
    async:
      request-timeout: ${AI_STREAM_REQUEST_TIMEOUT_MS:240000}

toolbox:
  recon:
    passive-sources-enabled: ${RECON_PASSIVE_SOURCES_ENABLED:true}
    # Optional trusted ICP provider. Use {domain} in the URL, or the server
    # appends a domain query parameter. HTTPS is required.
    icp-api-url: ${ICP_API_URL:}
    # Built-in direct query against the official MIIT ICP portal (beian.miit.gov.cn).
    # When enabled the server tries the built-in source first and falls back to the
    # manually configured icp-api-url. Defaults to enabled; set ICP_MI_ENABLED=false
    # to only use the manual icp-api-url source.
    icp-mi-enabled: ${ICP_MI_ENABLED:true}
    # The MIIT gateway no longer returns a challenge secretKey for the built-in
    # point-slide captcha, so the old auto chain is disabled by default. Kept off
    # unless the portal re-enables the token; the normal flow routes the operator
    # to the desktop "浏览器代填" assistant instead.
    icp-mi-auto-enabled: ${ICP_MI_AUTO_ENABLED:false}
    # Directory holding the PP-OCR ONNX model assets (det.onnx, rec.onnx,
    # ppocr_keys_v1.txt). When present, the built-in query attempts automatic
    # captcha solving first and falls back to the manual data source otherwise.
    icp-ocr-models-path: ${ICP_OCR_MODELS:./data/models/icp}
  auth:
    admin-password: ${ADMIN_PASSWORD:admin123}
    jwt-secret: ${JWT_SECRET:development-only-jwt-secret-change-me-32-bytes}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
    desktop-mode: ${TOOLBOX_DESKTOP:false}
    synchronize-desktop-admin-password: ${TOOLBOX_DESKTOP_SYNC_ADMIN_PASSWORD:false}
    allow-insecure-development-credentials: ${ALLOW_INSECURE_DEVELOPMENT_CREDENTIALS:false}
    migrate-legacy-development-credentials: ${MIGRATE_LEGACY_DEVELOPMENT_CREDENTIALS:false}
  ai:
    enabled: ${AI_ENABLED:false}
    api-mode: ${AI_API_MODE:chat}
    base-url: ${AI_BASE_URL:https://api.openai.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4.1-mini}
    # Idle timeout for AI reads. Every Responses SSE event resets the socket inactivity timer.
    timeout-seconds: ${AI_TIMEOUT_SECONDS:180}
    agent:
      runtime-enabled: ${AI_RUNTIME_ENABLED:true}
      runtime-base-url: ${AI_RUNTIME_URL:}
      runtime-port: ${AI_RUNTIME_PORT:8090}
      runtime-token: ${AI_RUNTIME_TOKEN:}
      runtime-project-signing-secret: ${AI_RUNTIME_PROJECT_SIGNING_SECRET:}
      runtime-timeout-seconds: ${AI_RUNTIME_TIMEOUT_SECONDS:120}
      memory-messages: ${AI_AGENT_MEMORY_MESSAGES:20}
      max-sessions: ${AI_AGENT_MAX_SESSIONS:200}
      session-ttl-minutes: ${AI_AGENT_SESSION_TTL_MINUTES:120}
      max-active-tasks-per-project: ${AI_AGENT_MAX_ACTIVE_TASKS_PER_PROJECT:20}
      max-active-tasks-per-target: ${AI_AGENT_MAX_ACTIVE_TASKS_PER_TARGET:4}
  execution:
    max-concurrent-tasks: ${MAX_CONCURRENT_TASKS:3}
    max-concurrent-tasks-per-target: ${MAX_CONCURRENT_TASKS_PER_TARGET:1}
    connect-timeout-seconds: 3
    max-ports-per-task: 65535
    max-nmap-ports-per-task: 65535
    max-authorized-ports: 65535
    allow-public-targets: ${ALLOW_PUBLIC_TARGETS:false}
    nmap-path: ${NMAP_PATH:nmap}
    nmap-timeout-seconds: 60
    nmap-full-timeout-seconds: 600
    nuclei-path: ${NUCLEI_PATH:nuclei}
    nuclei-templates-path: ${NUCLEI_TEMPLATES_PATH:${user.home}/nuclei-templates}
    nuclei-timeout-seconds: 900
    max-nuclei-ports-per-task: 65535
    afrog-path: ${AFROG_PATH:afrog}
    afrog-pocs-path: ${AFROG_POCS_PATH:${user.home}/afrog-pocs}
    afrog-timeout-seconds: 900
    xray-path: ${XRAY_PATH:xray}
    xray-pocs-path: ${XRAY_POCS_PATH:${user.home}/xray-pocs}
    xray-timeout-seconds: 900
    fscan-path: ${FSCAN_PATH:fscan}
    max-fscan-ports-per-task: 65535
    fscan-timeout-seconds: 600
    msf-path: ${MSF_PATH:msfconsole}
    msf-timeout-seconds: 600
    zap-path: ${ZAP_PATH:zap}
    zap-host: ${ZAP_HOST:127.0.0.1}
    zap-port: ${ZAP_PORT:8090}
    zap-startup-seconds: ${ZAP_STARTUP_SECONDS:120}
    zap-scan-timeout-seconds: ${ZAP_SCAN_TIMEOUT_SECONDS:1800}
    zap-max-alerts: ${ZAP_MAX_ALERTS:500}
  vulnerability-catalog:
    nuclei:
      templates-path: ${NUCLEI_TEMPLATES_PATH:${user.home}/nuclei-templates}
      import-on-startup: ${NUCLEI_CATALOG_IMPORT_ON_STARTUP:false}
      max-template-bytes: 2097152
    msf:
      import-on-startup: ${MSF_CATALOG_IMPORT_ON_STARTUP:false}
    afrog:
      pocs-path: ${AFROG_POCS_PATH:${user.home}/afrog-pocs}
    xray:
      pocs-path: ${XRAY_POCS_PATH:${user.home}/xray-pocs}
    scanner-pocs:
      import-on-startup: ${SCANNER_POC_CATALOG_IMPORT_ON_STARTUP:false}
      max-poc-bytes: 2097152
    cisa-kev-enabled: ${CISA_KEV_ENABLED:true}
    cisa-kev-url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
  fingerprints:
    # The built-in catalog is read-only; administrator updates are persisted here and take
    # effect immediately. Set rules-file to an explicitly managed external file when required.
    managed-rules-file: ${FINGERPRINT_MANAGED_RULES_FILE:./data/fingerprints/rules.json}
    rules-file: ${FINGERPRINT_RULES_FILE:}
  traffic:
    mitm-enabled: ${TRAFFIC_MITM_ENABLED:true}
    mitm-ca-path: ${TRAFFIC_MITM_CA_PATH:./data/traffic-mitm-ca.p12}
    mitm-ca-password: ${TRAFFIC_MITM_CA_PASSWORD:change-this-development-password}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/security_toolbox}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
